<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Programmation avancée – Spring Kotlin</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #0f172a;
        --card-bg: #1e293b;
        --card-border: #334155;
        --text: #e2e8f0;
        --muted: #94a3b8;
        --accent: #38bdf8;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 2.5rem 1.5rem 4rem;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      header {
        max-width: 960px;
        margin: 0 auto 2.5rem;
        text-align: center;
      }

      h1 {
        font-size: 2rem;
        margin-bottom: 0.5rem;
      }

      header p {
        color: var(--muted);
        margin: 0;
      }

      header p a {
        color: var(--accent);
      }

      .cards {
        max-width: 960px;
        margin: 0 auto;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 1.25rem;
      }

      .card {
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: 12px;
        padding: 1.5rem;
        background: var(--accent);
        color: #0f172a;
      }

      .card .links a.pdf {
        background: transparent;
        border: 1px solid var(--card-border);
        color: var(--text);
      }

      footer {
        max-width: 960px;
        margin: 2.5rem auto 0;
        text-align: center;
        color: var(--muted);
        font-size: 0.9rem;
      }

      footer a {
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Programmation avancée – Spring Kotlin</h1>
      <p>par <a href="https://zomzog.fr" target="_blank" rel="noopener">Zomzog</a></p>
    </header>

    <main class="cards">
      <div class="card">
        <h2>Cours 1</h2>
        <ul>
          <li>Java EE &amp; historique</li>
          <li>Injection de dépendances</li>
          <li>Spring Boot</li>
          <li>Spring MVC</li>
          <li>Tests</li>
        </ul>
        <div class="links">
          <a class="slides" href="c1/">Slides</a>
          <a class="pdf" href="c1/slides-export.pdf">PDF</a>
        </div>
      </div>
    </main>

    <footer>
      <a href="https://github.com/Zomzog/iut-spring-kotlin" target="_blank" rel="noopener">Code source du dépôt</a>
      ·
      <a href="https://github.com/Zomzog/iut-spring-kotlin/tree/main/code" target="_blank" rel="noopener"
        >Exemples de code</a
      >
    </footer>
  </body>
</html>
