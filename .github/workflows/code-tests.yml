name: Code tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Run tests
        working-directory: ./code
        run: ./gradlew test

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-report
          path: code/build/reports/tests/test
